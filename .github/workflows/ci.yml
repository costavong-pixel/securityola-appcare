name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Verify exact checked-out revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install pinned development tools
        run: |
          python -m pip install --require-hashes --requirement requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation --editable .

      - name: Format check
        run: ruff format --check appcare scripts tests

      - name: Lint
        run: ruff check appcare scripts tests

      - name: Type check
        run: mypy appcare scripts tests

      - name: Unit and integration tests
        run: pytest -q

      - name: Public-safety scan
        run: python scripts/check_public_safety.py

      - name: Worker restriction tests
        run: python scripts/verify_worker_policy.py

      - name: Dependency audit
        run: pip-audit --strict --requirement requirements-dev.lock

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
