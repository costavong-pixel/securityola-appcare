[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "securityola-appcare"
version = "0.0.0"
description = "SecurityOla AppCare engineering foundation"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "cryptography==50.0.0",
    "pydantic==2.13.4",
    "langgraph==1.2.9",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg==3.3.4",
    "sqlalchemy==2.0.52",
    "uvicorn==0.52.3",
]

[tool.setuptools.packages.find]
include = ["appcare*"]

[tool.setuptools.data-files]
"libexec" = [
    "ops/ssh/securityola-appcare-ssh-wrapper",
    "ops/ssh/install-securityola-appcare-release",
    "ops/ssh/securityola-appcare-release-guard",
    "ops/attestor/securityola-appcare-live-inventory-attestor",
    "ops/attestor/securityola-appcare-live-inventory-attestor.service",
]

[tool.setuptools.package-data]
appcare = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".agents", ".specify", "graphify-out"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["B008", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["appcare", "scripts", "tests"]
exclude = "(^|/)(.agents|.specify|graphify-out)(/|$)"
